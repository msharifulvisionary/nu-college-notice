name: Check College Notices

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (normal, test, or baseline)'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - test
          - baseline
      college_id:
        description: 'College UUID (for test or baseline mode)'
        required: false
        default: ''
        type: string
      test_run_id:
        description: 'Test or baseline run UUID'
        required: false
        default: ''
        type: string

concurrency:
  group: notice-scraper-${{ github.event.inputs.mode || 'normal' }}-${{ github.event.inputs.college_id || 'all' }}
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'scraper/package-lock.json'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Ensure headless browser for SPA fallback
        working-directory: scraper
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using pre-installed Chrome: $(command -v google-chrome)"
          elif [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium --only-shell --with-deps
          else
            npx playwright install-deps chromium
          fi

      - name: Run notice scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_MODE: ${{ github.event.inputs.mode || 'normal' }}
          TEST_COLLEGE_ID: ${{ github.event.inputs.college_id || '' }}
          TEST_RUN_ID: ${{ github.event.inputs.test_run_id || '' }}
        run: npx tsx src/scrape.ts
